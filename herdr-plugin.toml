id = "rad.herdr-mobile-relay"
name = "Herdr Mobile Relay"
version = "3.0.0"
min_herdr_version = "0.7.0"
description = "Owner-scoped Herdr and native agent HTTP relay over Unix socket for SSH clients"
platforms = ["linux", "macos"]

# This plugin is a thin launcher. The actual bridge runs as a systemd user service on Linux or a
# launchd user agent on macOS, so it outlives Herdr restarts (see ARCHITECTURE.md §3). The actions below shell out to
# scripts/relay-ctl.sh, which gets HERDR_SOCKET_PATH / HERDR_PLUGIN_CONFIG_DIR injected.

# Install dependencies and typecheck at install time. Herdr runs [[build]] steps ONLY on
# `herdr plugin install` (GitHub) — NOT on `herdr plugin link` (local dev). Delegating to
# `relay-ctl.sh build` keeps a single build definition (version gate → bun install → typecheck)
# shared with the `update` action. Still needs Bun on PATH.
[[build]]
command = ["bash", "scripts/relay-ctl.sh", "build"]
platforms = ["linux", "macos"]

[[actions]]
id = "start"
title = "Start bridge"
contexts = ["workspace"]
command = ["bash", "scripts/relay-ctl.sh", "start"]

[[actions]]
id = "stop"
title = "Stop bridge"
contexts = ["workspace"]
command = ["bash", "scripts/relay-ctl.sh", "stop"]

[[actions]]
id = "restart"
title = "Restart bridge"
contexts = ["workspace"]
command = ["bash", "scripts/relay-ctl.sh", "restart"]

# Full teardown: stops + disables the service and removes its service definition. Leaves the .env and the checkout (so `start` can bring it right back). See
# scripts/relay-ctl.sh → cmd_uninstall.
[[actions]]
id = "uninstall"
title = "Uninstall bridge (remove service)"
contexts = ["workspace"]
command = ["bash", "scripts/relay-ctl.sh", "uninstall"]

# Link-mode plugins ARE their on-disk git checkout (Herdr has no native `plugin update`), so this
# action pulls + reinstalls deps + restarts in one step. See scripts/relay-ctl.sh → cmd_update.
[[actions]]
id = "update"
title = "Update plugin"
contexts = ["workspace"]
command = ["bash", "scripts/relay-ctl.sh", "update"]

[[actions]]
id = "socket"
title = "Show relay socket"
contexts = ["workspace"]
command = ["bash", "scripts/relay-ctl.sh", "socket"]

[[actions]]
id = "status"
title = "Bridge status"
contexts = ["workspace"]
command = ["bash", "scripts/relay-ctl.sh", "status"]

[[actions]]
id = "version"
title = "Show version"
contexts = ["workspace"]
command = ["bash", "scripts/relay-ctl.sh", "version"]
